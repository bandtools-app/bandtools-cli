[package]
name = "bt"
version = "0.1.0"
edition = "2024"
description = "Command line interface for the BandTools REST API"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive", "env", "wrap_help"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "0.9.8"
tui = "0.19.0"
url = "2.5.7"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
